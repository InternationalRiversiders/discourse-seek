<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>导出觅电收藏</title><style>body{font:16px system-ui;max-width:600px;margin:60px auto;padding:20px;line-height:1.8}button{padding:12px 20px}</style><h1>带走你的收藏</h1><p>请使用原来收藏店铺的浏览器打开此页。下载后，在新版觅电的“收藏”页导入 JSON 内容；原收藏仍保留在此浏览器。</p><button id="export">下载收藏</button><p id="status" role="status"></p><p><a href="https://river-side.cc/food?view=favorites">进入新版觅电收藏页 →</a></p><script>document.getElementById('export').onclick=()=>{try{const ids=JSON.parse(localStorage.getItem('eating:favorites')||'[]');if(!Array.isArray(ids))throw Error('收藏格式异常');const url=URL.createObjectURL(new Blob([JSON.stringify(ids)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='seek-favorites.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent=`已导出 ${ids.length} 家店铺。`;}catch(e){document.getElementById('status').textContent='无法读取收藏。';}};</script></html>
